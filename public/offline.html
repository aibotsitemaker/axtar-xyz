<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Axtar.xyz — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .wrap { text-align: center; max-width: 320px; }
    .icon { font-size: 72px; margin-bottom: 24px; }
    h1 { font-size: 22px; font-weight: 700; color: #1e293b; margin-bottom: 12px; }
    p { font-size: 14px; color: #64748b; line-height: 1.7; margin-bottom: 28px; }
    .btn { display: inline-block; background: #185FA5; color: #fff; padding: 12px 28px; border-radius: 12px; font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer; border: none; }
    .logo { font-size: 20px; font-weight: 700; color: #185FA5; margin-bottom: 32px; }
    .logo span { color: #E24B4A; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">Axtar<span>.</span>xyz</div>
    <div class="icon">📡</div>
    <h1>İnternet bağlantısı yoxdur</h1>
    <p>Axtar.xyz-ə qoşulmaq üçün internet bağlantısı lazımdır. Bağlantınızı yoxlayıb yenidən cəhd edin.</p>
    <button class="btn" onclick="window.location.reload()">🔄 Yenidən cəhd et</button>
  </div>
</body>
</html>
